name: pegelTool Pages – publish preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pegeltool-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}pegeltool-preview/
    steps:
      - name: Checkout isolated pegelTool preview branch
        uses: actions/checkout@v4
        with:
          ref: deploy/pegeltool-pages-preview-20261117
      - name: Build static preview
        run: python3 scripts/build-pegeltool-pages.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
