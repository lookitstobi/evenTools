name: Deploy to Strato

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'deploy.py'
      - 'requirements-deploy.txt'
      - '_bootstrap.php'
      - '*.php'
      - 'app/**'
      - 'assets/**'

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-deploy.txt'
      
      - name: Install dependencies
        run: pip install -r requirements-deploy.txt
      
      - name: Deploy to Strato
        run: python3 deploy.py
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_PASS: ${{ secrets.STRATO_PASS }}
          STRATO_PATH: ${{ secrets.STRATO_PATH }}
          STRATO_DATA_PATH: ${{ secrets.STRATO_DATA_PATH }}
          STRATO_BACKUP_PATH: ${{ secrets.STRATO_BACKUP_PATH }}
          DEPLOY_BACKUP_ENABLED: ${{ secrets.DEPLOY_BACKUP_ENABLED }}
          DEPLOY_BACKUP_INTERVAL_SECONDS: ${{ secrets.DEPLOY_BACKUP_INTERVAL_SECONDS }}
          DEPLOY_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
