name: Firewall Compatibility Guard

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/firewall-guard.yml'
      - 'scripts/firewall_guard.php'
      - '*.php'
      - 'app/**'
      - 'assets/**'

concurrency:
  group: firewall-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firewall-guard:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run firewall compatibility guard
        run: php scripts/firewall_guard.php
