<body>
<header class="header">
  <div id="complianceDot" class="compliance-dot status-empty"></div>
  <div class="title"><h1>Schallpegelmessung – DIN 15905‑5</h1></div>
  <div class="header-controls">
    <div class="header-main-actions">
      <button id="btnImport" class="icon-btn subtle" type="button" title="Rohlog importieren und Messdaten auswerten">Log importieren</button>
      <button id="btnPdfTemplate" class="icon-btn" type="button" disabled title="Messbericht als PDF mit der aktuellen Vorlage exportieren">PDF exportieren</button>

    </div>
    <div class="header-secondary-actions">
      <details class="header-menu">
        <summary class="icon-btn subtle menu-trigger" title="Erweiterte Export- und Projektaktionen anzeigen">Erweitert</summary>

          <div class="menu-list">
            <button id="btnPdf" class="menu-item-btn" type="button" disabled title="Messbericht mit dem Legacy-PDF-Generator exportieren">PDF exportieren (Legacy)</button>

Opernplatz 10, 45128 Essen
Geschäftsführer: Fritz Frömming
Intendanz Philharmonie Essen: Babette Nierenz</textarea>

  </div>
</div>

<script>
let samples = [];
let chartSamples = [];
let chartLAeq = null;
let chartLCpeak = null;
let lastLogText = '';
let lastLogFileName = '';
let logLoaded = false;
let reservedPdfPreviewWindow = null;

const LIMIT_LAEQ_30 = 99;
const LIMIT_LCPEAK  = 135;

const FORM_FIELD_IDS = [
  'eventName','datumMessung','location','umwelt','messungVon','messposition','lautestePosition',
  'foh','organisator','beschreibung','berichtDatum','berichtName','kalibratorModell','kalibratorSN',

];

    tick: '#e6e9ed',

    maxPoint: '#dc2626',
    tooltipBg: '#ffffff',
    tooltipText: '#272727'
  }
};

const PA_DEFAULT_QTY = {

  "L-ACOUSTIC KS21": 4,

    {type:"L-ACOUSTIC KS21", qty:4},

    {type:"L-ACOUSTIC 5XT", qty:6}
  ]
};

function makeEmptyHeader(){
  return {
    deviceModel:"", deviceSN:"", firmware:"",
    micType:"", micSN:"", micCal:"", micSens:"",
    k1:"", k2:"", kset:"",
    start:"", end:"",
    logIntervalText:"", logIntervalSec:1
  };
}

function makeEmptySummary(){
  return { source:"", laeq_total:null, laeq_g30:null, lcpeak_max:null, lafmax_dt:null };
}

let header = makeEmptyHeader();

let parsedColumns = { available:[], used:{} };
let summary = makeEmptySummary();

function el(id){ return document.getElementById(id); }
function setText(id, t){ if(el(id)) el(id).textContent = String(t ?? ""); }
function getVal(id){ return (el(id)?.value ?? "").toString(); }
function setVal(id, v){ if(el(id)) el(id).value = (v ?? "").toString(); }

function getFormState(){
  const out = {};
  for(const id of FORM_FIELD_IDS){ out[id] = getVal(id); }
  return out;
}

function setFormState(form){
  if(!form || typeof form !== 'object') return;
  for(const id of FORM_FIELD_IDS){ if(Object.prototype.hasOwnProperty.call(form, id)) setVal(id, form[id]); }
}

function collectPAItems(){
  const rows = Array.from(document.querySelectorAll('#paContainer .compact-row'));
  return rows.map(r=>{
    const sel = r.querySelector('select');
    const custom = r.querySelector('input[placeholder="Eigener Typ"]');
    const num = r.querySelector('input[type="number"]');
    const type = sel ? sel.value : '';
    const customType = custom ? custom.value : '';
    const qtyRaw = num ? String(num.value || '').trim() : '';
    const qty = qtyRaw ? Number(qtyRaw) : null;
    if(!type && !customType && (qtyRaw === '')) return null;
    return { type, customType, qty: (qty!=null && Number.isFinite(qty)) ? qty : null };
  }).filter(Boolean);
}

function restorePAItems(items){
  const container = el('paContainer');
  if(!container) return;
  container.innerHTML = '';

  if(!Array.isArray(items) || !items.length){
    applyLocationPreset(getVal('location'));
    return;
  }

  for(const it of items){
    const row = paRow('', '');
    const sel = row.querySelector('select');
    const custom = row.querySelector('input[placeholder="Eigener Typ"]');
    const num = row.querySelector('input[type="number"]');
    const isCustom = it.type === 'custom' || (it.customType && it.type !== 'custom');
    if(sel){
      sel.value = isCustom ? 'custom' : (it.type || '');
      try{ sel.dispatchEvent(new Event('change')); }catch(e){}
    }
    if(custom && isCustom){
      custom.value = it.customType || '';
      custom.style.display = 'block';
    }
    if(num && it.qty!=null && Number.isFinite(Number(it.qty))) num.value = Number(it.qty);
    container.appendChild(row);
  }
  setText('paPresetInfo', 'Preset: gespeichert');
}

function buildStateObject(options = {}){
  const includeSamples = options.includeSamples !== false;
  const includeChartSamples = options.includeChartSamples !== false;
  const includeLogText = options.includeLogText !== false;
  return {
    schemaVersion: STATE_SCHEMA_VERSION,
    sourceApp: 'pegelTool',
    savedAt: new Date().toISOString(),
    header: header,
    samples: includeSamples ? samples : [],
    chartSamples: includeChartSamples ? chartSamples : [],
    summary: summary,
    logLoaded: !!logLoaded,
    form: getFormState(),
    paItems: collectPAItems(),
    logText: includeLogText ? lastLogText : '',
    logFileName: lastLogFileName || ''
  };
}

function normalizeState(raw){
  if(!raw || typeof raw !== 'object') return null;

  const normalizedForm = {};
  const srcForm = (raw.form && typeof raw.form === 'object') ? raw.form : {};
  for(const id of FORM_FIELD_IDS){ normalizedForm[id] = (srcForm[id] ?? '').toString(); }

  const srcHeader = (raw.header && typeof raw.header === 'object') ? raw.header : {};
  const normalizedHeader = { ...makeEmptyHeader(), ...srcHeader };
  normalizedHeader.logIntervalSec = Number(normalizedHeader.logIntervalSec);
  if(!Number.isFinite(normalizedHeader.logIntervalSec) || normalizedHeader.logIntervalSec <= 0){
    normalizedHeader.logIntervalSec = 1;
  }

  const srcSummary = (raw.summary && typeof raw.summary === 'object') ? raw.summary : {};
  const normalizedSummary = { ...makeEmptySummary(), ...srcSummary };

  const normalizedPA = Array.isArray(raw.paItems)
    ? raw.paItems.map(it=>({
        type: String(it?.type ?? ''),
        customType: String(it?.customType ?? ''),
        qty: (it?.qty != null && Number.isFinite(Number(it.qty))) ? Number(it.qty) : null
      })).filter(it => it.type || it.customType || it.qty != null)
    : [];

  return {
    schemaVersion: Number(raw.schemaVersion) || 0,
    sourceApp: String(raw.sourceApp || ''),
    savedAt: String(raw.savedAt || ''),
    header: normalizedHeader,
    samples: Array.isArray(raw.samples) ? raw.samples : [],
    chartSamples: Array.isArray(raw.chartSamples) ? raw.chartSamples : [],
    summary: normalizedSummary,
    form: normalizedForm,
    paItems: normalizedPA,
    logText: String(raw.logText || ''),
    logFileName: String(raw.logFileName || ''),
    logLoaded: !!raw.logLoaded
  };
}

function updateStateChips(){
  if(logLoaded && Array.isArray(samples) && samples.length){
    setDot('dotLog','ok');
    const name = lastLogFileName ? ` (${lastLogFileName})` : ' (gespeichert)';
    setText('chipLog', `Log: geladen${name}`);
  } else {
    setDot('dotLog','warn');
    setText('chipLog', 'Log: nicht geladen');
  }

  const hasSummary = summary && (summary.source && (summary.lafmax_dt!=null || summary.laeq_g30!=null || summary.lcpeak_max!=null));
  if(hasSummary){ setDot('dotSummary','ok'); setText('chipSummary','Summary: verwendet'); }
  else { setDot('dotSummary','warn'); setText('chipSummary','Summary: nicht gefunden (Fallback)'); }
}

function updateRecoveryButton(){
  const btn = el('btnRecover');
  if(!btn) return;
  let hasState = false;
  try{ hasState = !!localStorage.getItem(RECOVERY_STORAGE_KEY); }catch(e){ hasState = false; }
  btn.style.display = hasState ? 'block' : 'none';
  btn.disabled = !hasState;
}

function closeHeaderMenus(exceptMenu = null){
  document.querySelectorAll('.header-menu[open]').forEach(menu => {
    if(exceptMenu && menu === exceptMenu) return;
    menu.removeAttribute('open');
  });
}

function persistRecoveryState(){
  const store = (stateObj)=> localStorage.setItem(RECOVERY_STORAGE_KEY, JSON.stringify(stateObj));

  try{
    store(buildStateObject());
    updateRecoveryButton();
    return;
  }catch(err){
    console.warn('Full recovery save failed, trying compact fallback.', err);
  }

  try{
    const compact = buildStateObject({ includeSamples:false, includeChartSamples:false, includeLogText:false });
    compact.recoveryPartial = true;
    compact.recoveryNote = 'Nur Formulardaten gespeichert (Speicherlimit).';
    store(compact);
    updateRecoveryButton();
    if(!recoveryFallbackNotified){
      recoveryFallbackNotified = true;
      setText('parseInfo', 'Hinweis: Lokales Recovery wurde platzsparend gespeichert (nur Formulardaten).');
    }
  }catch(err2){
    console.warn('Compact recovery save failed.', err2);
    if(!recoveryFallbackNotified){
      recoveryFallbackNotified = true;
      setText('parseInfo', 'Hinweis: Lokales Recovery konnte nicht gespeichert werden (Browser-Speicher begrenzt).');
    }
  }
}

function scheduleRecoverySave(){
  if(recoverySaveTimer) clearTimeout(recoverySaveTimer);
  recoverySaveTimer = setTimeout(()=>{
    recoverySaveTimer = null;
    persistRecoveryState();
  }, RECOVERY_DEBOUNCE_MS);
}

function applySavedState(rawState, options = {}){
  const state = normalizeState(rawState);
  if(!state) throw new Error('Ungueltiger Stand: keine gueltigen Zustandsdaten gefunden.');

  setFormState(state.form);
  restorePAItems(state.paItems);

  header = state.header;
  summary = state.summary;
  samples = state.samples;
  chartSamples = state.chartSamples;
  lastLogText = state.logText;
  lastLogFileName = state.logFileName;
  logLoaded = Array.isArray(samples) && samples.length > 0;

  writeHeaderToUI();

  if(logLoaded){
    calculateAndRender();
  } else {
    const tbody = document.querySelector('#pegelTabelle tbody');
    if(tbody) tbody.innerHTML = '';
    setText('chartInfo', '');
    if(chartLAeq){ chartLAeq.destroy(); chartLAeq = null; }
    if(chartLCpeak){ chartLCpeak.destroy(); chartLCpeak = null; }
    setPdfButtonsDisabled(true);
    updateComplianceStatus();
    updateStateChips();
  }

  markRequiredFields();
  if(options.persistRecovery !== false) scheduleRecoverySave();
}

function recoverLastSession(){
  let raw = '';
  try{ raw = localStorage.getItem(RECOVERY_STORAGE_KEY) || ''; }
  catch(err){ alert('Lokaler Browser-Speicher ist nicht verfuegbar.'); return; }

  if(!raw){
    updateRecoveryButton();
    alert('Keine lokale Session zum Wiederherstellen gefunden.');
    return;
  }

  try{
    const parsed = JSON.parse(raw);
    applySavedState(parsed, { persistRecovery:false });
    const stamp = parsed && parsed.savedAt ? new Date(parsed.savedAt).toLocaleString('de-DE') : null;
    setText('parseInfo', stamp ? `Lokale Session wiederhergestellt (${stamp}).` : 'Lokale Session wiederhergestellt.');
  }catch(err){
    console.error(err);
    alert('Lokale Session konnte nicht wiederhergestellt werden.');
  }
}

function triggerDownload(blob, fileName, openInNewTab){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  if(openInNewTab){
    try{ window.open(url, '_blank'); }catch(e){ console.warn('Could not open preview tab', e); }
  }
  setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 8000);
}

function reservePdfPreviewWindow(){
  if(reservedPdfPreviewWindow && !reservedPdfPreviewWindow.closed){
    return reservedPdfPreviewWindow;
  }
  try{
    const w = window.open('/toolserve.php?name=pegelTool&file=pdf_loading.html', '_blank');
    if(!w) return null;
    try{ w.opener = null; }catch(_err){}

    reservedPdfPreviewWindow = w;
    return w;
  }catch(_err){
    return null;
  }
}

function consumeReservedPdfPreviewWindow(){
  if(reservedPdfPreviewWindow && !reservedPdfPreviewWindow.closed){
    const w = reservedPdfPreviewWindow;
    reservedPdfPreviewWindow = null;
    return w;
  }
  reservedPdfPreviewWindow = null;
  return null;
}

async function createServerPreviewUrl(blob, fileName){
  const csrf = (window.TOOLSAPP_RUNTIME && window.TOOLSAPP_RUNTIME.csrf) ? String(window.TOOLSAPP_RUNTIME.csrf) : '';
  if(!csrf) throw new Error('Fehlender CSRF-Token für PDF-Vorschau.');

  const safeFileName = String(fileName || 'Messprotokoll.pdf')
    .replace(/[\\/:*?"<>|]/g, '-')
    .trim() || 'Messprotokoll.pdf';

  const form = new FormData();
  form.append('csrf', csrf);
  form.append('filename', safeFileName);
  form.append('pdf_file', new File([blob], safeFileName, { type: 'application/pdf' }));

  const res = await fetch('/pdf_preview_api.php?action=create', {
    method: 'POST',
    credentials: 'same-origin',
    body: form,
  });

  const payload = await res.json().catch(() => null);
  if(!res.ok || !payload || !payload.ok || !payload.url){
    throw new Error('Server-Vorschau konnte nicht erzeugt werden.');
  }
  return String(payload.url);
}

async function openPdfPreview(blob, fileName){
  let previewUrl = '';
  try{
    previewUrl = await createServerPreviewUrl(blob, fileName);
  }catch(err){
    console.error(err);
    setText('parseInfo', 'PDF wurde erzeugt, aber die Vorschau konnte nicht vorbereitet werden.');
    return;
  }

  try {
    let previewWindow = consumeReservedPdfPreviewWindow();
    if(previewWindow){
      previewWindow.location.replace(previewUrl);
      return;
    }
  } catch(err) {
    console.warn('Could not open PDF preview tab', err);
  }

  setText('parseInfo', 'PDF wurde erzeugt, aber die reservierte Vorschau war nicht mehr verfügbar. Bitte erneut auf "PDF aus Vorlage" klicken.');
}

function parseDownloadFilenameFromContentDisposition(headerValue){
  const raw = String(headerValue || '').trim();
  if(!raw) return '';

  // RFC 5987: filename*=UTF-8''...
  const starMatch = raw.match(/filename\*\s*=\s*([^;]+)/i);
  if(starMatch && starMatch[1]){
    let encoded = String(starMatch[1]).trim();
    encoded = encoded.replace(/^UTF-8''/i, '').replace(/^"|"$/g, '');
    try {
      const decoded = decodeURIComponent(encoded);
      if(decoded) return decoded;
    } catch(_err) {
      // Fallback to filename below.
    }
  }

  const plainMatch = raw.match(/filename\s*=\s*(?:"([^"]+)"|([^;]+))/i);
  if(plainMatch){
    const value = (plainMatch[1] || plainMatch[2] || '').trim();
    if(value) return value;
  }

  return '';
}

function extractEmbeddedStateFromHtml(html){
  const text = String(html || '');
  const marker = 'window.__SAVED_STATE__ = ';
  let from = 0;

  while(true){
    const start = text.indexOf(marker, from);
    if(start < 0) return null;

    let i = start + marker.length;
    while(i < text.length && /\s/.test(text[i])) i++;

    // Ignore source-code occurrences like "const marker = 'window.__SAVED_STATE__ = '".
    if(text[i] !== '{'){
      from = start + marker.length;
      continue;
    }

    let depth = 0;
    let inString = false;
    let escaped = false;

    for(let j=i; j<text.length; j++){
      const ch = text[j];
      if(inString){
        if(escaped){ escaped = false; continue; }
        if(ch === '\\'){ escaped = true; continue; }
        if(ch === '"'){ inString = false; }
        continue;
      }
      if(ch === '"'){ inString = true; continue; }
      if(ch === '{') depth++;
      if(ch === '}'){
        depth--;
        if(depth === 0){
          return JSON.parse(text.slice(i, j+1));
        }
      }
    }

    from = start + marker.length;
  }
}

function parseStateFromText(name, text){
  const lower = String(name || '').toLowerCase();
  if(lower.endsWith('.html') || lower.endsWith('.htm') || String(text).includes('window.__SAVED_STATE__')){
    const embedded = extractEmbeddedStateFromHtml(text);
    if(embedded) return embedded;
    throw new Error('In der HTML-Datei wurde kein gespeicherter Zustand gefunden.');
  }
  return JSON.parse(text);
}

function splitLines(text){
  return String(text ?? "").replace(/\r/g, "").split("\n");
}

function parseNumber(s){
  if(s == null) return null;
  const t = String(s).trim();
  if(!t) return null;
  if(t.includes('---')) return null;
  const v = Number(t.replace(',', '.'));
  return Number.isFinite(v) ? v : null;
}

function parseIntervalSeconds(v){
  if(!v) return 1;
  const s = String(v).trim();
  const main = s.split(',')[0].trim();
  const parts = main.split(':');
  if(parts.length === 3){
    const hh = Number(parts[0]), mm = Number(parts[1]), ss = Number(parts[2]);
    if([hh,mm,ss].every(Number.isFinite)) return hh*3600 + mm*60 + ss;
  }
  if(parts.length === 2){
    const mm = Number(parts[0]), ss = Number(parts[1]);
    if([mm,ss].every(Number.isFinite)) return mm*60 + ss;
  }
  const n = Number(main);
  return (Number.isFinite(n) && n>0) ? n : 1;
}

function secondsToHMS(sec){
  sec = Math.max(0, Math.round(sec||0));
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec%60;
  const mm = String(m).padStart(2,'0');
  const ss = String(s).padStart(2,'0');
  return h>0 ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
}

function normalizeColName(s){
  const t = String(s ?? "").trim().toLowerCase();
  return t.replace(/[^a-z0-9]+/g,'');
}

function buildColumnIndex(headerLine){
  const colsRaw = headerLine.replace(/\t/g,' ').trim().split(/\s+/).filter(Boolean);
  const norm = colsRaw.map(c => normalizeColName(c));
  const map = new Map();
  norm.forEach((n,i)=>{ if(n) map.set(n,i); });
  parsedColumns.available = colsRaw;
  return { colsRaw, norm, map };
}

function findCol(map, candidates){
  for(const c of candidates){ if(map.has(c)) return map.get(c); }
  for(const [k, idx] of map.entries()){
    for(const c of candidates){ if(k.includes(c)) return idx; }
  }
  return null;
}

function setUsedColumns(col){
  const idxDate  = findCol(col.map, ['yyyymmdd','date']);
  const idxTime  = findCol(col.map, ['hhmmss','time']);
  const idxTimer = findCol(col.map, ['timer']);
  const idxLAeqDT = findCol(col.map, ['laeqdtk1','laeqdt','laeqk1','laeq']);
  const idxG30    = findCol(col.map, ['laeqg30k1','laeqg30','g30']);
  const idxLCpk   = findCol(col.map, ['lcpkmaxdtk2','lcpkmaxdt','lcpkmax','lcpeak','lcpk']);
  const idxLAFmax = findCol(col.map, ['lafmaxdtk1','lafmaxdt','lafmax']);
  parsedColumns.used = { date:idxDate, time:idxTime, timer:idxTimer, laeq_dt:idxLAeqDT, laeq_g30:idxG30, lcpkmax:idxLCpk, lafmax:idxLAFmax };
}

function parseHeaderAndMeta(text){
  header = makeEmptyHeader();

  const lines = splitLines(text);

  // Robust value finder:
  // - matches if the line CONTAINS the key (case-insensitive)
  // - returns text after the first ':' if present, otherwise the remainder after the key
  function findValueContains(key){
    const k = String(key||"").toLowerCase();
    for(const l of lines){
      const s = String(l||"");
      const sl = s.toLowerCase();
      const pos = sl.indexOf(k);
      if(pos < 0) continue;
      const colon = s.indexOf(":");
      if(colon >= 0) return s.slice(colon+1).trim();
      return s.slice(pos + String(key||"").length).trim();
    }
    return "";
  }

  function parseKValueTail(tail){
    const m = String(tail || '').match(/[+-]?\d+(?:[.,]\d+)?/);
    if(m) return m[0].replace(',', '.');
    return String(tail || '').trim().split(/\s+/)[0] || "";
  }

  // Device
  const devLine = findValueContains("Device Info") || findValueContains("Device information") || "";
  if(devLine){
    const parts = devLine.split(",").map(x=>x.trim()).filter(Boolean);
    header.deviceModel = parts[0] || "";
    for(const p of parts){
      const pl = p.toLowerCase();
      // XL3 often writes "SNo" or "SN" variants
      if(pl.includes("sno") || pl.includes("sn")) header.deviceSN = p.split(/\s+/).slice(-1)[0].trim();
      if(pl.includes("fw") || pl.includes("firmware")){
        const tail = p.replace(/firmware/i,"").replace(/fw/i,"").trim();
        header.firmware = tail.split(/\s+/).slice(-1)[0].trim();
      }
    }
  }

  // Mic
  const micLine = findValueContains("Mic Type") || findValueContains("Microphone Type") || "";
  if(micLine){
    const parts = micLine.split(",").map(x=>x.trim()).filter(Boolean);
    header.micType = parts[0] || "";
    for(const p of parts){
      const pl = p.toLowerCase();
      if(pl.includes("sno") || pl.includes("sn")) header.micSN = p.split(/\s+/).slice(-1)[0].trim();
      if(pl.includes("calibrated")) header.micCal = p.replace(/calibrated/i, "").trim();
    }
  }

  // Some logs store calibration as separate line
  if(!header.micCal){
    header.micCal = findValueContains("Mic calibrated") || findValueContains("Microphone calibrated") || "";
  }

  header.micSens = findValueContains("Mic Sensitivity") || findValueContains("Microphone Sensitivity") || "";
  header.kset = findValueContains("kset date") || findValueContains("kset") || "";
  header.logIntervalText = findValueContains("Log-Interval") || findValueContains("Log Interval") || "";
  header.logIntervalSec = parseIntervalSeconds(header.logIntervalText);

  // k1 / k2 often appear as "k1:" in arbitrary lines
  for(const l of lines){
    const s = String(l||"");
    const sl = s.toLowerCase();
    if(sl.includes("k1:") && !header.k1){
      const i = sl.indexOf("k1:");
      header.k1 = parseKValueTail(s.slice(i+3).trim());
    }
    if(sl.includes("k2:") && !header.k2){
      const i = sl.indexOf("k2:");
      header.k2 = parseKValueTail(s.slice(i+3).trim());
    }
  }

  // Start / End can be written as "Start"/"End" or "Start:"/"End:" somewhere in header.
  const start = findValueContains("Start");
  const end   = findValueContains("End");
  header.start = (start||"").replace(/,/g," ").trim();
  header.end   = (end||"").replace(/,/g," ").trim();
}


function locateTimeSeriesBlock(lines){
  let idxHdr = -1;
  for(let i=0;i<lines.length;i++){
    const t = String(lines[i]||"").trim().toLowerCase();
    if(t === '# broadband log results') { idxHdr = i; break; }
  }
  if(idxHdr < 0) return { ok:false, reason:"Header '# Broadband Log Results' nicht gefunden." };

  let idxPlaceholder = -1;
  for(let i=idxHdr+1;i<lines.length;i++){
    const t = String(lines[i]||"");
    if(t.includes('[YYYY-MM-DD]')){ idxPlaceholder = i; break; }
  }

  let headerIdx = -1;
  let dataStartIdx = -1;

  if(idxPlaceholder >= 0){
    for(let i=idxPlaceholder-1;i>idxHdr;i--){
      const t = String(lines[i]||"").trim();
      if(!t) continue;
      if(t.startsWith('#')) break;
      headerIdx = i;
      break;
    }
    dataStartIdx = idxPlaceholder + 1;
  } else {
    let idxFirstData = -1;
    for(let i=idxHdr+1;i<lines.length;i++){
      const t = String(lines[i]||"").trim();
      if(!t) continue;
      if(t.startsWith('#')) break;
      if(/^\d{4}-\d{2}-\d{2}/.test(t)){ idxFirstData = i; break; }
    }
    if(idxFirstData < 0) return { ok:false, reason:"Keine Datenzeilen nach '# Broadband Log Results' gefunden." };

    for(let i=idxFirstData-1;i>idxHdr;i--){
      const t = String(lines[i]||"").trim();
      if(!t) continue;
      if(t.startsWith('#')) break;
      headerIdx = i;
      break;
    }
    dataStartIdx = idxFirstData;
  }

  if(headerIdx < 0) return { ok:false, reason:"Keine Spalten-Headerzeile im Broadband-Block gefunden." };

  let blockEndIdx = -1;
  for(let i=dataStartIdx;i<lines.length;i++){
    const t = String(lines[i]||"").trim();
    if(t.startsWith('#')){ blockEndIdx = i; break; }
  }
  if(blockEndIdx < 0) blockEndIdx = lines.length;

  return { ok:true, headerIdx, dataStartIdx, blockEndIdx };
}

function parseBroadbandTimeSeries(text){
  const lines = splitLines(text);
  samples = [];
  parsedColumns = { available:[], used:{} };

  const loc = locateTimeSeriesBlock(lines);
  if(!loc.ok){
    setText('parseInfo', loc.reason);
    return { ok:false, reason:loc.reason };
  }

  const headerLine = String(lines[loc.headerIdx]||"").trim();
  const col = buildColumnIndex(headerLine);
  setUsedColumns(col);

  const u = parsedColumns.used;

  for(let i=loc.dataStartIdx;i<loc.blockEndIdx;i++){
    const raw = String(lines[i]||"");
    const t = raw.trim();
    if(!t) continue;
    if(t.startsWith('#')) break;

    const parts = raw.replace(/\t/g,' ').trim().split(/\s+/).filter(Boolean);
    if(parts.length < 3) continue;

    const date = (u.date != null && u.date < parts.length) ? parts[u.date] : parts[0];
    const time = (u.time != null && u.time < parts.length) ? parts[u.time] : parts[1];

    const laeq_dt  = parseNumber((u.laeq_dt != null && u.laeq_dt < parts.length) ? parts[u.laeq_dt] : null);
    const laeq_g30 = parseNumber((u.laeq_g30 != null && u.laeq_g30 < parts.length) ? parts[u.laeq_g30] : null);
    const lcpkmax  = parseNumber((u.lcpkmax != null && u.lcpkmax < parts.length) ? parts[u.lcpkmax] : null);
    const lafmax   = parseNumber((u.lafmax != null && u.lafmax < parts.length) ? parts[u.lafmax] : null);

    if(laeq_dt==null && laeq_g30==null && lcpkmax==null && lafmax==null) continue;
    samples.push({ date, time, LAeq_dt: laeq_dt, LAeq_g30: laeq_g30, LCpk: lcpkmax, LAFmax: lafmax });
  }

  setText('parseInfo',
    `Erkannte Spalten: ${col.colsRaw.length}. Genutzt: Date=${u.date ?? '—'}, Time=${u.time ?? '—'}, Timer=${u.timer ?? '—'}, LAeq_dt=${u.laeq_dt ?? '—'}, LAeq_g30=${u.laeq_g30 ?? '—'}, LAFmax=${u.lafmax ?? '—'}, LCpeak=${u.lcpkmax ?? '—'}. Samples=${samples.length.toLocaleString()}.`
  );

  if(samples.length){
    const first = samples[0];
    const last = samples[samples.length-1];
    if(!header.start) header.start = `${first.date} ${first.time}`;
    header.end = `${last.date} ${last.time}`;
  }

  return { ok:true };
}

function parseBroadbandSummary(text){
  summary = makeEmptySummary();
  const lines = splitLines(text);

  let idxHdr = -1;
  for(let i=0;i<lines.length;i++){
    const t = String(lines[i]||"").trim().toLowerCase();
    if(t === '# broadband log results over whole log period'){ idxHdr = i; break; }
  }
  if(idxHdr < 0) return { ok:false };

  let dataIdx = -1;
  for(let i=idxHdr+1;i<lines.length;i++){
    const t = String(lines[i]||"").trim();
    if(!t) continue;
    if(t.startsWith('#')) break;
    dataIdx = i; break;
  }
  if(dataIdx < 0) return { ok:false };

  const u = parsedColumns.used || {};
  const parts = String(lines[dataIdx]||"").replace(/\t/g,' ').trim().split(/\s+/).filter(Boolean);

  summary.source = '# Broadband Log Results over whole log period';
  summary.laeq_total = parseNumber((u.laeq_dt  != null && u.laeq_dt  < parts.length) ? parts[u.laeq_dt]  : null);
  summary.laeq_g30   = parseNumber((u.laeq_g30 != null && u.laeq_g30 < parts.length) ? parts[u.laeq_g30] : null);
  summary.lcpeak_max = parseNumber((u.lcpkmax  != null && u.lcpkmax  < parts.length) ? parts[u.lcpkmax]  : null);
  summary.lafmax_dt  = parseNumber((u.lafmax   != null && u.lafmax   < parts.length) ? parts[u.lafmax]   : null);

  return { ok:true };
}

function calcEnergyAvgDb(values){
  let sum = 0, n = 0;
  for(const v of values){
    if(v==null || !Number.isFinite(v)) continue;
    sum += Math.pow(10, v/10);
    n++;
  }
  if(n===0) return null;
  return 10*Math.log10(sum/n);
}

function downsampleForDisplay(raw, maxPoints=900){
  const normalized = raw.map((s, idx)=>({
    sourceIndex: idx,
    date: s.date,
    time: s.time,
    LAeq_g30: s.LAeq_g30,
    LC: s.LCpk
  }));

  function maxIndexByKey(arr, key){
    let idx = -1;
    let max = -Infinity;
    for(let i=0;i<arr.length;i++){
      const v = arr[i]?.[key];
      if(v==null || !Number.isFinite(v)) continue;
      if(v > max){
        max = v;
        idx = i;
      }
    }
    return idx;
  }

  const n = normalized.length;
  if(n<=maxPoints){
    return {
      data: normalized.map(s=>({date:s.date, time:s.time, LAeq_g30:s.LAeq_g30, LC:s.LC})),
      bucketSize:1,
      injectedPeaks:0
    };
  }

  const bucketSize = Math.ceil(n/maxPoints);
  const out=[];
  for(let i=0;i<n;i+=bucketSize){
    const chunk = normalized.slice(i, i+bucketSize);
    const laVals = chunk.map(s => s.LAeq_g30).filter(v=>v!=null && Number.isFinite(v));
    const lcVals = chunk.map(s => s.LC).filter(v=>v!=null && Number.isFinite(v));
    const LAeq_g30 = calcEnergyAvgDb(laVals);
    const LC   = lcVals.length ? Math.max(...lcVals) : null;
    out.push({ sourceIndex: chunk[0].sourceIndex, date: chunk[0].date, time: chunk[0].time, LAeq_g30, LC });
  }

  const mustKeep = new Set();
  const maxLAIdx = maxIndexByKey(normalized, 'LAeq_g30');
  const maxLCIdx = maxIndexByKey(normalized, 'LC');
  if(maxLAIdx >= 0) mustKeep.add(maxLAIdx);
  if(maxLCIdx >= 0) mustKeep.add(maxLCIdx);

  const outIdx = new Set(out.map(p=>p.sourceIndex));
  let injectedPeaks = 0;
  for(const idx of mustKeep){
    if(outIdx.has(idx)) continue;
    const s = normalized[idx];
    out.push({
      sourceIndex: s.sourceIndex,
      date: s.date,
      time: s.time,
      LAeq_g30: s.LAeq_g30,
      LC: s.LC,
      _forcedPeak: true
    });
    injectedPeaks++;
  }

  out.sort((a,b)=>a.sourceIndex - b.sourceIndex);
  return {
    data: out.map(({date,time,LAeq_g30,LC})=>({date,time,LAeq_g30,LC})),
    bucketSize,
    injectedPeaks
  };
}

function countExceedDuration(values, limit){
  let count = 0;
  for(const v of values){ if(v!=null && Number.isFinite(v) && v>limit) count++; }
  return count * (header.logIntervalSec || 1);
}

function addRow(name, value, limit, exceedDuration=null){

  const durationText = (typeof exceedDuration === 'number') ? secondsToHMS(exceedDuration) : '—';
  const limitText = (typeof limit === 'number') ? (limit + ' dB') : '—';
  if(typeof limit === 'number' && typeof value === 'number') ok = value <= limit;
  const status = ok===null ? '—' : (ok ? 'OK' : 'NICHT OK');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>${name}</td>
    <td>${valueText}</td>
    <td>${durationText}</td>
    <td>${limitText}</td>
    <td class='${ok===null ? '' : (ok ? 'status-ok' : 'status-bad')}'>${status}</td>
  `;
  tbody.appendChild(tr);
}

};

  options.plugins.darkBgPlugin.background = theme.bg;
  options.plugins.tooltip = options.plugins.tooltip || {};
  options.plugins.tooltip.backgroundColor = theme.tooltipBg;
  options.plugins.tooltip.titleColor = theme.tooltipText;
  options.plugins.tooltip.bodyColor = theme.tooltipText;
  options.scales = options.scales || {};
  options.scales.x = options.scales.x || {};
  options.scales.y = options.scales.y || {};
  options.scales.x.ticks = options.scales.x.ticks || {};
  options.scales.y.ticks = options.scales.y.ticks || {};
  options.scales.x.grid = options.scales.x.grid || {};
  options.scales.y.grid = options.scales.y.grid || {};
  options.scales.y.title = options.scales.y.title || {};
  options.scales.x.ticks.color = theme.tick;
  options.scales.y.ticks.color = theme.tick;
  options.scales.x.grid.color = theme.grid;
  options.scales.y.grid.color = theme.grid;
  options.scales.y.title.color = theme.label;
  if(chart.data.datasets[0]) chart.data.datasets[0].borderColor = theme.line;
  if(chart.data.datasets[1]) chart.data.datasets[1].borderColor = theme.limit;

function buildMaxPointDataset(values, baseLabel, theme){
  let maxIdx = -1;
  let maxVal = -Infinity;
  for(let i=0;i<values.length;i++){
    const v = values[i];
    if(v==null || !Number.isFinite(v)) continue;
    if(v > maxVal){
      maxVal = v;
      maxIdx = i;
    }
  }
  const data = values.map((_,i)=> (i === maxIdx ? maxVal : null));
  return {
    label: `${baseLabel} (Maximum)`,
    data,
    showLine: false,
    pointRadius: 5,
    pointHoverRadius: 6,
    pointBackgroundColor: theme.maxPoint,
    pointBorderColor: theme.label,
    pointBorderWidth: 1.2
  };
}

function mkChart(canvas, label, values, limit, limitLabel){
  const theme = CHART_THEMES[currentChartTheme] || CHART_THEMES.dark;
  return new Chart(canvas,{
    type:'line',
    plugins:[whiteBgPlugin],
    data:{
      labels: chartSamples.map((_,i)=>i),
      datasets:[
        { label, data: values, borderWidth: 2, pointRadius: 0, tension: 0.2, borderColor: theme.line },
        { label: limitLabel, data: chartSamples.map(()=>limit), borderWidth: 2, pointRadius: 0, borderDash: [6,4], borderColor: theme.limit },
        { label: 'Überschreitung', data: values.map(v => (v!=null && v>limit) ? v : null), showLine:false, pointRadius: 4, backgroundColor: theme.exceed },
        buildMaxPointDataset(values, label, theme)
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:true,
      aspectRatio:1.6,
      devicePixelRatio: 2,
      animation:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        darkBgPlugin:{ background: theme.bg },
        legend:{display:false},
        tooltip:{
          backgroundColor: theme.tooltipBg,
          titleColor: theme.tooltipText,
          bodyColor: theme.tooltipText,
          titleFont:{size:12},
          bodyFont:{size:12},
          padding:8,
          cornerRadius:8,
          displayColors:false,
          callbacks:{
            title:(items)=>{
              const idx = items[0]?.dataIndex;
              const s = chartSamples[idx];
              return s ? `#${idx} ${s.time}` : '';
            },
            label:(ctx)=>`${ctx.dataset.label}: ${ctx.formattedValue}`
          }
        }
      },
      scales:{
        x:{
          ticks:{
            color: theme.tick,
            font:{size:11},
            maxTicksLimit: 10,
            callback:(val)=>{ const s=chartSamples[Number(val)]; return s ? s.time : ''; }

          grid:{color: theme.grid}
        },
        y:{
          ticks:{color: theme.tick, font:{size:12}},
          grid:{color: theme.grid},
          title:{display:true,text:'dB',color: theme.label, font:{size:12}}
        }
      }
    }
  });
}

function resetChartCanvas(id){
  const canvas = el(id);
  if(!canvas || !canvas.parentNode) return canvas;

  const replacement = document.createElement('canvas');
  replacement.id = id;
  if(canvas.className) replacement.className = canvas.className;
  if(canvas.style.cssText) replacement.style.cssText = canvas.style.cssText;
  canvas.parentNode.replaceChild(replacement, canvas);
  return replacement;
}

function renderCharts(){
  if(chartLAeq) chartLAeq.destroy();
  if(chartLCpeak) chartLCpeak.destroy();
  if(!chartSamples.length) return;
  const laeqCanvas = resetChartCanvas('chartLAeq');
  const lcpeakCanvas = resetChartCanvas('chartLCpeak');
  const la = chartSamples.map(s=>s.LAeq_g30);
  const lc = chartSamples.map(s=>s.LC);
  chartLAeq = mkChart(laeqCanvas, 'LAeq_g30', la, LIMIT_LAEQ_30, `Grenzwert ${LIMIT_LAEQ_30} dB(A)`);
  chartLCpeak = mkChart(lcpeakCanvas, 'LCpeak', lc, LIMIT_LCPEAK, `Grenzwert ${LIMIT_LCPEAK} dB(C)`);

}

function calculateAndRender(){
  const tbody = document.querySelector('#pegelTabelle tbody');
  tbody.innerHTML = "";

  const hasSummary = summary && (summary.source && (summary.lafmax_dt!=null || summary.laeq_g30!=null || summary.lcpeak_max!=null));

  const lafMax    = hasSummary ? summary.lafmax_dt : (samples.length ? Math.max(...samples.map(s=>s.LAFmax).filter(v=>v!=null && Number.isFinite(v))) : null);
  const laeqG30   = hasSummary ? summary.laeq_g30 : (samples.length ? Math.max(...samples.map(s=>s.LAeq_g30).filter(v=>v!=null && Number.isFinite(v))) : null);
  const lcPeakMax = hasSummary ? summary.lcpeak_max : (samples.length ? Math.max(...samples.map(s=>s.LCpk).filter(v=>v!=null && Number.isFinite(v))) : null);

  const durLA = countExceedDuration(samples.map(s=> s.LAeq_g30).filter(v=>v!=null), LIMIT_LAEQ_30);
  const durLC = countExceedDuration(samples.map(s=> s.LCpk).filter(v=>v!=null), LIMIT_LCPEAK);

  addRow('LAeq_g30', laeqG30, LIMIT_LAEQ_30, durLA);
  addRow('LCpeak (max)', lcPeakMax, LIMIT_LCPEAK, durLC);
  addRow('LAF (max)', lafMax, LIMIT_LAEQ_30, null);

  const ds = downsampleForDisplay(samples, 900);
  chartSamples = ds.data;
  const peakInfo = ds.injectedPeaks ? ` inkl. ${ds.injectedPeaks} echtem Spitzenwert-Punkt` : '';
  setText('chartInfo', `Diagramme: ${samples.length.toLocaleString()} Originalpunkte → ${chartSamples.length.toLocaleString()} Punkte${peakInfo} (je Punkt ~${ds.bucketSize*(header.logIntervalSec||1)}s).`);
  setText('laeqChartLabel', 'LAeq_g30 Verlauf mit Grenzwert 99 dB(A)');

  renderCharts();

  if(hasSummary){ setDot('dotSummary','ok'); setText('chipSummary','Summary: verwendet'); }
  else { setDot('dotSummary','warn'); setText('chipSummary','Summary: nicht gefunden (Fallback)'); }

  // update header compliance indicator based on table results
  updateComplianceStatus();

  setPdfButtonsDisabled(false);
}

function getChartImageData(chart, scale){
  const src = chart?.canvas;
  if(!src) return null;
  const s = Math.max(1, Number(scale) || 1);
  const out = document.createElement('canvas');
  out.width = Math.max(1, src.width * s);
  out.height = Math.max(1, src.height * s);
  const ctx = out.getContext('2d');
  ctx.scale(s, s);
  ctx.drawImage(src, 0, 0);
  return out.toDataURL('image/png');
}

function addChartImage(doc, chart, x, y, maxW, maxH, scale){
  if(!chart) return 0;
  const w = chart.canvas?.width || 1;
  const h = chart.canvas?.height || 1;
  const ratio = w / h;
  let drawW = maxW;
  let drawH = drawW / ratio;
  if(drawH > maxH){
    drawH = maxH;
    drawW = drawH * ratio;
  }
  const data = getChartImageData(chart, scale);
  if(!data) return 0;
  const offsetX = x + (maxW - drawW) / 2;
  doc.addImage(data, 'PNG', offsetX, y, drawW, drawH);
  return drawH;
}

async function generateTemplatePDF(){
  const PDFLib = window.PDFLib;
  if(!PDFLib){
    alert('pdf-lib konnte nicht geladen werden.');
    return;
  }

  // 1. Aktive Vorlage laden.
  setPdfButtonsDisabled(true);
  let templateMeta = null;
  try{
    const metaRes = await fetch('/pdf_template_api.php?action=get_active_template&tool_key=pegelTool',
      { credentials: 'same-origin' });
    if(metaRes.ok){
      const metaJson = await metaRes.json();
      if(metaJson.ok && metaJson.template) templateMeta = metaJson.template;
    }
  }catch(e){ /* Netzwerkfehler → Legacy-Fallback */ }

  if(!templateMeta){
    // Kein Template zugewiesen → Legacy-PDF.
    setPdfButtonsDisabled(false);
    await generateLegacyPDF();
    return;
  }

  // 2. PDF-Bytes holen.
  let pdfBytes = null;
  try{
    const pdfRes = await fetch(
      '/pdf_template_api.php?action=get_pdf&id=' + templateMeta.id + '&tool_key=pegelTool',
      { credentials: 'same-origin' }
    );
    if(pdfRes.ok) pdfBytes = await pdfRes.arrayBuffer();
  }catch(e){ /* Laden fehlgeschlagen */ }

  if(!pdfBytes){
    setPdfButtonsDisabled(false);
    alert('Vorlage konnte nicht geladen werden. Fallback auf Legacy-PDF.');
    await generateLegacyPDF();
    return;
  }

  // 3. Messdaten-Mapping (identisch zu payloadData, aber nur Strings).
  const formatLevel = (value, unit) => {
    const n = Number(value);
    if(!Number.isFinite(n)) return '—';
    return n.toFixed(1) + ' ' + unit;
  };

  const complianceStatus = (value, limit) => {
    const n = Number(value);
    if(!Number.isFinite(n)) return '—';
    return n > limit ? 'NEGATIV' : 'OK';
  };

  const paItems = collectPAItems();

  // Überschreitungsdauern und lauteste Werte für Template-Variablen
  const excLAeqSec    = samples.length ? countExceedDuration(samples.map(s => s.LAeq_dt).filter(v => v != null), LIMIT_LAEQ_30) : 0;
  const excLAfSec     = samples.length ? countExceedDuration(samples.map(s => s.LAFmax).filter(v => v != null), LIMIT_LAEQ_30) : 0;
  const excLAeqG30Sec = samples.length ? countExceedDuration(samples.map(s => s.LAeq_g30).filter(v => v != null), LIMIT_LAEQ_30) : 0;
  const excLCpeakSec  = samples.length ? countExceedDuration(samples.map(s => s.LCpk).filter(v => v != null), LIMIT_LCPEAK) : 0;
  const laeqTotalVal = (summary && summary.laeq_total != null)
    ? summary.laeq_total
    : calcEnergyAvgDb(samples.map(s=>s.LAeq_dt));
  const lafMaxVal = (summary && summary.lafmax_dt != null)
    ? summary.lafmax_dt
    : (samples.length ? (()=>{ const vals = samples.map(s=>s.LAFmax).filter(v=>v!=null&&Number.isFinite(v)); return vals.length ? Math.max(...vals) : null; })() : null);
  const laeqG30Val = (summary && summary.laeq_g30 != null)
    ? summary.laeq_g30
    : (samples.length ? (()=>{ const vals = samples.map(s=>s.LAeq_g30).filter(v=>v!=null&&Number.isFinite(v)); return vals.length ? Math.max(...vals) : null; })() : null);
  const laeqMaxVal = samples.length
    ? (()=>{ const vals = samples.map(s=>s.LAeq_dt).filter(v=>v!=null&&Number.isFinite(v)); return vals.length ? Math.max(...vals) : null; })()
    : null;
  const lcPeakVal = (summary && summary.lcpeak_max != null)
    ? summary.lcpeak_max
    : (samples.length ? (()=>{ const vals = samples.map(s=>s.LCpk).filter(v=>v!=null&&Number.isFinite(v)); return vals.length ? Math.max(...vals) : null; })() : null);

  const data = {
    project_name:         getVal('eventName').trim(),
    measurement_date:     getVal('datumMessung').trim() || getVal('berichtDatum').trim(),
    operator_name:        getVal('messungVon').trim() || getVal('berichtName').trim(),
    result_laeq:          formatLevel(laeqTotalVal, 'dB(A)'),
    result_laeq_g30:      formatLevel(laeqG30Val, 'dB(A)'),
    result_laf:           formatLevel(lafMaxVal, 'dB(A)'),
    result_peak:          formatLevel(lcPeakVal, 'dB(C)'),
    result_laeq_status:   complianceStatus(laeqTotalVal, 99),
    result_laf_status:    complianceStatus(lafMaxVal, 99),
    result_laeq_g30_status: complianceStatus(laeqG30Val, 99),
    result_peak_status:   complianceStatus(lcPeakVal, 135),
    customer:             getVal('foh').trim(),
    location:             getVal('location').trim(),
    environment:          getVal('umwelt').trim(),
    measurement_position: getVal('messposition').trim(),
    loudest_position:     getVal('lautestePosition').trim(),
    organiser:            getVal('organisator').trim(),
    description:          getVal('beschreibung').trim(),
    report_date:          getVal('berichtDatum').trim(),
    report_name:          getVal('berichtName').trim(),
    report_city:          getVal('berichtsort').trim(),
    device_model:         getVal('messgeraet').trim(),
    device_sn:            getVal('messgeraetSN').trim(),
    calibrator_model:     getVal('kalibratorModell').trim(),
    calibrator_sn:        getVal('kalibratorSN').trim(),
    firmware:             getVal('firmware').trim(),
    log_interval:         getVal('logInterval').trim(),
    start_measurement:    getVal('startMessung').trim(),
    end_measurement:      getVal('endeMessung').trim(),
    kset_date:            getVal('kset').trim(),
    correction_k1:        getVal('k1').trim() ? getVal('k1').trim() + ' dB(A)' : '',
    correction_k2:        getVal('k2').trim() ? getVal('k2').trim() + ' dB(C)' : '',
    pa_setup:             getPASetupInline(),
    microphone:           getVal('mikrofon').trim(),
    mic_type:             header.micType || '',
    mic_sn:               header.micSN || '',
    mic_sensitivity:      getVal('mikroSens').trim(),
    mic_calibration_date: getVal('micCal').trim(),
    param_name_1:         'LAeq_g30',
    param_name_2:         'LAF',
    param_name_3:         'LCpeak',
    limit_laeq:           LIMIT_LAEQ_30 + ' dB(A)',
    limit_laeq_g30:       LIMIT_LAEQ_30 + ' dB(A)',
    limit_lcpeak:         LIMIT_LCPEAK  + ' dB(C)',
    exceedance_laeq:      secondsToHMS(excLAeqSec),
    exceedance_laeq_g30:  secondsToHMS(excLAeqG30Sec),
    exceedance_laf:       secondsToHMS(excLAfSec),
    exceedance_lcpeak:    secondsToHMS(excLCpeakSec),
    result_laeq_max:      formatLevel(laeqMaxVal, 'dB(A)'),
    result_laf_max:       formatLevel(lafMaxVal, 'dB(A)'),
    result_lcpeak_max:    formatLevel(lcPeakVal, 'dB(C)'),
  };

  // PA-Einzelpositionen (bis zu 8)
  for(let i = 0; i < 8; i++){
    const item  = paItems[i];
    const label = item ? (item.type === '__custom__' ? (item.customType || '?') : item.type) : '';
    data[`pa_item_${i + 1}`] = item && label ? `${item.qty ?? '?'} × ${label}` : '';
  }

  // 4. Hintergrund-PDF laden und Felder einblenden.
  try{
    const bgDoc = await PDFLib.PDFDocument.load(pdfBytes);

    // Felder aufteilen: AcroForm-Text, AcroForm-Diagramm, Koordinaten-Bild, Koordinaten-Text.
    const allFields       = Array.isArray(templateMeta.fields) ? templateMeta.fields : [];
    const acroFields      = allFields.filter(f => f.mode === 'acro');
    const imageFields     = allFields.filter(f => f.mode === 'image');
    const coordFields     = allFields.filter(f => (f.mode || '') !== 'acro' && (f.mode || '') !== 'image');

    const CHART_VAR_KEYS  = new Set(['chart_laeq_image', 'chart_laeq_g30_image', 'chart_lcpeak_image']);
    const acroTextFields  = acroFields.filter(f => !CHART_VAR_KEYS.has(f.field));
    const acroChartFields = acroFields.filter(f =>  CHART_VAR_KEYS.has(f.field));

    // Positionen der Diagramm-AcroFelder VOR dem Flatten einsammeln.
    const acroChartPositions = [];
    if(acroChartFields.length){
      try{
        const bgPages    = bgDoc.getPages();
        const acroForm   = bgDoc.getForm();
        const allAcroFld = acroForm.getFields();
        for(const entry of acroChartFields){
          try{
            const pdfField = allAcroFld.find(f => f.getName() === entry.acro_field_name);
            if(!pdfField) continue;
            const widgets  = pdfField.acroField.getWidgets();
            if(!widgets.length) continue;
            const widget   = widgets[0];
            const rect     = widget.getRectangle();
            let pageIndex  = 0;
            try{
              const pRef = widget.dict.get(PDFLib.PDFName.of('P'));
              if(pRef && pRef.objectNumber != null){
                const idx = bgPages.findIndex(p => p.ref.objectNumber === pRef.objectNumber);
                if(idx >= 0) pageIndex = idx;
              }
            }catch(_){}
            acroChartPositions.push({ field: entry.field, pageIndex, rect });
          }catch(e){ console.warn('Diagramm-AcroFeld nicht lesbar:', entry.acro_field_name, e); }
        }
      }catch(e){}
    }

    // AcroForm-Textfelder befüllen und gesamtes Formular flatten.
    if(acroTextFields.length || acroChartFields.length){
      try{
        const form = bgDoc.getForm();
        for(const f of acroTextFields){
          const value = String(data[f.field] ?? '');
          if(!value || !f.acro_field_name) continue;
          try{
            const field = form.getTextField(f.acro_field_name);
            field.setText(value);
            const rawSz = Number(f.size_pt) || 10;
            field.setFontSize(Math.max(1, rawSz - 2));
          }catch(e){ /* Feld nicht vorhanden oder falscher Typ – ignorieren */ }
        }
        form.flatten();
      }catch(e){ /* Kein AcroForm in diesem PDF – ignorieren */ }
    }

    const outDoc = await PDFLib.PDFDocument.create();

    // Alle Seiten aus Hintergrund-PDF kopieren (mit gefüllten AcroForm-Feldern).
    const pageIndices = bgDoc.getPageIndices();
    const copiedPages = await outDoc.copyPages(bgDoc, pageIndices);
    copiedPages.forEach(p => outDoc.addPage(p));

    // Standard-Fonts laden (in pdf-lib eingebaut, kein Download).
    const fontMap = {
      regular: await outDoc.embedFont(PDFLib.StandardFonts.Helvetica),
      bold:    await outDoc.embedFont(PDFLib.StandardFonts.HelveticaBold),
    };

    // Koordinaten-Felder als Text einblenden.
    for(const f of coordFields){
      const pageIdx = Math.max(0, (f.page || 1) - 1);
      if(pageIdx >= outDoc.getPageCount()) continue;

      const page = outDoc.getPage(pageIdx);
      const { height: pageHeight } = page.getSize();

      const value = String(data[f.field] ?? '');
      if(!value) continue;

      // Farbe: Status-Felder automatisch einfärben, neutrale Texte etwas weicher setzen.
      let color = PDFLib.rgb(96 / 255, 96 / 255, 96 / 255);
      if(f.field && f.field.endsWith('_status')){
        if(value === 'OK')           color = PDFLib.rgb(0.08, 0.65, 0.42); // grün
        else if(value === 'NEGATIV') color = PDFLib.rgb(1.0,  0.39, 0.18); // rot
      } else {
        const hex = String(f.color || '#000000');
        if(/^#[0-9a-fA-F]{6}$/.test(hex)){
          const r = parseInt(hex.slice(1, 3), 16) / 255;
          const g = parseInt(hex.slice(3, 5), 16) / 255;
          const b = parseInt(hex.slice(5, 7), 16) / 255;
          const isNearBlack = r <= 0.08 && g <= 0.08 && b <= 0.08;
          color = isNearBlack ? PDFLib.rgb(96 / 255, 96 / 255, 96 / 255) : PDFLib.rgb(r, g, b);
        }
      }

      // Ausrichtung.
      let textAlign = PDFLib.TextAlignment.Left;
      if(f.align === 'center') textAlign = PDFLib.TextAlignment.Center;
      else if(f.align === 'right')  textAlign = PDFLib.TextAlignment.Right;

      const rawSizePt = Number(f.size_pt) || 10;
      const sizePt = Math.max(1, rawSizePt - 2);
      const xPt = mmToPt(Number(f.x_mm) || 0);
      // PDF-Koordinatenursprung ist unten-links; Y von oben umrechnen.
      const yPt = pageHeight - mmToPt(Number(f.y_mm) || 0) - sizePt;

      page.drawText(value, {
        x: xPt,
        y: yPt,
        size: sizePt,
        font: fontMap.regular,
        color: color,
      });
    }

    // Bild-Felder einblenden (Koordinaten-Modus und AcroForm-Positionen).
    const chartCanvasMap = {
      chart_laeq_image:   chartLAeq   ? document.getElementById('chartLAeq')   : null,
      chart_laeq_g30_image: chartLAeq ? document.getElementById('chartLAeq')   : null,
      chart_lcpeak_image: chartLCpeak ? document.getElementById('chartLCpeak') : null,
    };

    // Koordinaten-basierte Bild-Felder.
    for(const f of imageFields){
      const canvas = chartCanvasMap[f.field] || null;
      if(!canvas) continue;
      const pageIdx = Math.max(0, (f.page || 1) - 1);
      if(pageIdx >= outDoc.getPageCount()) continue;
      try{
        applyChartTheme('light');
        const pngDataUrl = canvas.toDataURL('image/png');
        applyChartTheme('dark');
        const base64 = pngDataUrl.split(',')[1];
        const binStr = atob(base64);
        const bytes  = new Uint8Array(binStr.length);
        for(let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
        const pdfImg = await outDoc.embedPng(bytes);
        const page   = outDoc.getPage(pageIdx);
        const { height: pageH } = page.getSize();
        const xPt = mmToPt(Number(f.x_mm) || 0);
        const wPt = mmToPt(Number(f.w_mm) || 100);
        const hPt = mmToPt(Number(f.h_mm) || 70);
        const yPt = pageH - mmToPt(Number(f.y_mm) || 0) - hPt;
        page.drawImage(pdfImg, { x: xPt, y: yPt, width: wPt, height: hPt });
      }catch(e){
        console.warn('Bild-Feld konnte nicht gezeichnet werden:', f.field, e);
      }
    }

    // AcroForm-basierte Diagramm-Felder (Position aus Formular-Rechteck).
    for(const pos of acroChartPositions){
      const canvas = chartCanvasMap[pos.field] || null;
      if(!canvas) continue;
      if(pos.pageIndex >= outDoc.getPageCount()) continue;
      try{
        applyChartTheme('light');
        const pngDataUrl = canvas.toDataURL('image/png');
        applyChartTheme('dark');
        const base64 = pngDataUrl.split(',')[1];
        const binStr = atob(base64);
        const bytes  = new Uint8Array(binStr.length);
        for(let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
        const pdfImg = await outDoc.embedPng(bytes);
        const page   = outDoc.getPage(pos.pageIndex);
        page.drawImage(pdfImg, {
          x:      pos.rect.x,
          y:      pos.rect.y,
          width:  pos.rect.width,
          height: pos.rect.height,
        });
      }catch(e){
        console.warn('AcroForm-Diagramm konnte nicht eingefügt werden:', pos.field, e);
      }
    }

    const mainBytes = await outDoc.save();
    const templateHasEmbeddedCharts = imageFields.some(f => CHART_VAR_KEYS.has(f.field)) || acroChartFields.length > 0;

    // 5. Fallback: Nur bei alten Vorlagen ohne eigene Chart-Felder eine Charts-Seite anhängen.
    const buildChartsPagePdf = () => {
      const jsPDFRef = window.jspdf?.jsPDF;
      if (!jsPDFRef) return null;
      if (!chartLAeq && !chartLCpeak) return null;

    const doc = new jsPDFRef({ unit: 'mm', format: 'a4' });
    const M = 12;
    const pageW = 210 - 2 * M;

    const drawHeader = () => {
      doc.setDrawColor(200, 200, 200);
      doc.line(M, 24, M + pageW, 24);
      doc.setTextColor(50, 50, 50);
      doc.setFontSize(16);
      doc.setFont(undefined, 'bold');
      doc.text('Messverlauf', M + 2, 12);
      doc.setFontSize(11);
      doc.setFont(undefined, 'normal');
      const ev = getVal('eventName').trim() || '(unbenannt)';
      doc.text(`Veranstaltung: ${ev}`, M + 2, 20);
    };

    const drawFooter = () => {
      const pageH = doc.internal.pageSize.getHeight();
      const footerTextY = pageH - 10;
      const footerRuleY = footerTextY - 4;
      doc.setDrawColor(225, 225, 225);
      doc.line(M, footerRuleY, M + pageW, footerRuleY);
      doc.setFontSize(9);
      doc.setTextColor(150, 150, 150);
      doc.text('Diagramme', M, footerTextY);
      const dateText = `Erstellt: ${new Date().toLocaleDateString('de-DE')}`;
      doc.text(dateText, M + pageW - doc.getTextWidth(dateText), footerTextY);
    };

    drawHeader();
    let y = 31;

    if (chartLAeq) {
      doc.setFontSize(12);
      doc.setFont(undefined, 'bold');
      doc.setTextColor(40, 40, 40);
      doc.text('LAeq_g30 mit Grenzwert 99 dB(A)', M, y);
      const h = addChartImage(doc, chartLAeq, M, y + 5, pageW, 96, 2);
      y += h + 14;
    }

    if (chartLCpeak) {
      if (y + 112 > 280) {
        drawFooter();
        doc.addPage();
        drawHeader();
        y = 31;
      }
      doc.setFontSize(12);
      doc.setFont(undefined, 'bold');
      doc.setTextColor(40, 40, 40);
      doc.text('LCpeak mit Grenzwert 135 dB(C)', M, y);
      addChartImage(doc, chartLCpeak, M, y + 5, pageW, 96, 2);
    }

    const totalPages = doc.getNumberOfPages();
    for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
      doc.setPage(pageNum);
      drawFooter();
    }

    return doc.output('arraybuffer');
  };

  const mergePdfBuffers = async (firstBuffer, secondBuffer) => {
    const PDFDocument = window.PDFLib?.PDFDocument;
    if (!PDFDocument) {
      return firstBuffer;
    }

    const out = await PDFDocument.create();

    const first = await PDFDocument.load(firstBuffer);
    const firstPages = await out.copyPages(first, first.getPageIndices());
    firstPages.forEach((p) => out.addPage(p));

    if (secondBuffer) {
      const second = await PDFDocument.load(secondBuffer);
      const secondPages = await out.copyPages(second, second.getPageIndices());
      secondPages.forEach((p) => out.addPage(p));
    }

    return out.save();
  };


    let secondPdfBuffer = null;
    if (!templateHasEmbeddedCharts) {
      applyChartTheme('light');
      secondPdfBuffer = buildChartsPagePdf();
      applyChartTheme('dark');
    }

    const mergedBytes = await mergePdfBuffers(mainBytes, secondPdfBuffer);
    const blob = new Blob([mergedBytes], { type: 'application/pdf' });
    const fallbackName = `${sanitizeBaseName()}.pdf`;
    await openPdfPreview(blob, fallbackName);
  }catch(e){
    console.error('Template-PDF Fehler:', e);
    alert('Fehler beim Erstellen des Template-PDFs: ' + e.message);
  }finally{
    setPdfButtonsDisabled(false);
  }
}

async function generateLegacyPDF(){
  const { jsPDF } = window.jspdf || {};
  if(!jsPDF) { alert('jsPDF konnte nicht geladen werden.'); return; }

  const doc = new jsPDF({unit:'mm', format:'a4'});
  const M = 12;
  const pageW = 210 - 2*M;
  const pageH = doc.internal.pageSize.getHeight();
  const footerSafeZone = 10;
  const footerTextY = pageH - footerSafeZone;
  const footerRuleY = footerTextY - 4;
  const contentMaxY = footerRuleY - 6;
  const signatureBlockHeight = 46;
  const signatureTopY = contentMaxY - signatureBlockHeight;

  async function drawHeader(){
    const logoUrl = '/assets/Logos/pegelTools.png';
    const maxH = 12;
    const maxW = 40;
    try {
      await new Promise((resolve)=>{
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = ()=>{
          try{
            const iw = img.naturalWidth || img.width;
            const ih = img.naturalHeight || img.height;
            const imgAspect = iw/ih;
            const boxAspect = maxW/maxH;
            let wmm, hmm;
            if(imgAspect > boxAspect){
              wmm = maxW;
              hmm = maxW / imgAspect;
            } else {
              hmm = maxH;
              wmm = maxH * imgAspect;
            }
            const canvas = document.createElement('canvas');
            canvas.width = iw; canvas.height = ih;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img,0,0);
            const dataUrl = canvas.toDataURL('image/png');
            const x = M + pageW - wmm;
            const y = 6;
            doc.addImage(dataUrl, 'PNG', x, y, wmm, hmm);
          }catch(e){
            console.warn('Logo load/draw failed', e);
          }
          resolve();
        };
        img.onerror = ()=>{ resolve(); };
        img.src = logoUrl;
        setTimeout(resolve, 1500);
      });
    } catch(e){ console.warn('drawHeader logo error', e); }

    doc.setDrawColor(200, 200, 200);
    doc.line(M, 24, M+pageW, 24);
    doc.setTextColor(50, 50, 50);
    doc.setFontSize(16);
    doc.setFont(undefined,'bold');
    doc.text('Schallpegelmessung', M+2, 12);
    doc.setFontSize(11);
    doc.setFont(undefined,'normal');
    doc.text('gemäß DIN 15905-5', M+2, 21);
  }

  function drawFooter(pageNum, totalPages){
    doc.setDrawColor(225, 225, 225);
    doc.line(M, footerRuleY, M+pageW, footerRuleY);
    doc.setFontSize(9);
    doc.setTextColor(150, 150, 150);
    doc.text(`Seite ${pageNum}/${totalPages}`, M, footerTextY);
    const date = new Date().toLocaleDateString('de-DE');
    const dateText = `Erstellt: ${date}`;
    doc.text(dateText, M + pageW - doc.getTextWidth(dateText), footerTextY);
  }

  async function startNewPage(){
    doc.addPage();
    await drawHeader();
    return 28;
  }

  async function ensureSpaceWithin(y, neededHeight, maxY){
    if(y + neededHeight <= maxY) return y;
    return startNewPage();
  }

  function drawAllFooters(){
    const totalPages = doc.getNumberOfPages();
    for(let pageNum = 1; pageNum <= totalPages; pageNum++){
      doc.setPage(pageNum);
      drawFooter(pageNum, totalPages);
    }
  }

  function section(y, t){
    doc.setFontSize(11);
    doc.setFont(undefined,'bold');
    doc.setTextColor(12, 67, 145);
    doc.text(t, M, y);
    doc.setDrawColor(12, 67, 145);
    doc.setLineWidth(0.5);
    doc.line(M, y+0.8, M+pageW, y+0.8);
    doc.setTextColor(50, 50, 50);
    return y + 7;
  }

  function fieldPair(y, label1, val1, label2, val2){
    const col1W = pageW/2 - 2;
    doc.setFontSize(9);
    doc.setFont(undefined,'bold');
    doc.setTextColor(100, 100, 100);
    doc.text(label1, M, y);
    doc.setFont(undefined,'normal');
    doc.setTextColor(50, 50, 50);
    const lines1 = wrap(doc, val1||'—', col1W-5);
    doc.text(lines1, M, y+4);

    doc.setFont(undefined,'bold');
    doc.setTextColor(100, 100, 100);
    doc.text(label2, M+pageW/2+2, y);
    doc.setFont(undefined,'normal');
    doc.setTextColor(50, 50, 50);
    const lines2 = wrap(doc, val2||'—', col1W-5);
    doc.text(lines2, M+pageW/2+2, y+4);

    return y + Math.max(lines1.length, lines2.length)*4 + 6;
  }

  function fieldTriple(y, label1, val1, label2, val2, label3, val3){
    const gap = 4;
    const colW = (pageW - (2*gap)) / 3;
    const x1 = M;
    const x2 = M + colW + gap;
    const x3 = M + (2*(colW + gap));

    doc.setFontSize(9);

    doc.setFont(undefined,'bold');
    doc.setTextColor(100, 100, 100);
    doc.text(label1, x1, y);
    doc.setFont(undefined,'normal');
    doc.setTextColor(50, 50, 50);
    const lines1 = wrap(doc, val1||'—', colW-4);
    doc.text(lines1, x1, y+4);

    doc.setFont(undefined,'bold');
    doc.setTextColor(100, 100, 100);
    doc.text(label2, x2, y);
    doc.setFont(undefined,'normal');
    doc.setTextColor(50, 50, 50);
    const lines2 = wrap(doc, val2||'—', colW-4);
    doc.text(lines2, x2, y+4);

    doc.setFont(undefined,'bold');
    doc.setTextColor(100, 100, 100);
    doc.text(label3, x3, y);
    doc.setFont(undefined,'normal');
    doc.setTextColor(50, 50, 50);
    const lines3 = wrap(doc, val3||'—', colW-4);
    doc.text(lines3, x3, y+4);

    return y + Math.max(lines1.length, lines2.length, lines3.length)*4 + 6;
  }

  function textBox(y, text){
    const lines = wrap(doc, text || '—', pageW - 4);
    const boxH = Math.max(14, lines.length * 4 + 8);
    doc.setDrawColor(210, 210, 210);
    doc.rect(M, y, pageW, boxH);
    doc.setFontSize(9);
    doc.setFont(undefined,'normal');
    doc.setTextColor(50, 50, 50);
    doc.text(lines, M + 2, y + 6);
    return y + boxH;
  }

  function drawSignatureBlock(topY){
    const sigTitleY = topY + 6;
    doc.setFontSize(11);
    doc.setFont(undefined,'bold');
    doc.setTextColor(50,50,50);
    doc.text('Unterschrift', M, sigTitleY);

    const sigFieldsY = sigTitleY + 6;
    doc.setFontSize(9);
    doc.setFont(undefined,'bold');
    doc.setTextColor(100,100,100);
    doc.text('Datum', M, sigFieldsY);
    doc.setFont(undefined,'normal');
    doc.setTextColor(50,50,50);
    doc.text(String(getVal('berichtDatum')||''), M+18, sigFieldsY);

    doc.setFont(undefined,'bold');
    doc.setTextColor(100,100,100);
    doc.text('Name', M+pageW/2, sigFieldsY);
    doc.setFont(undefined,'normal');
    doc.setTextColor(50,50,50);
    doc.text(String(getVal('berichtName')||''), M+pageW/2+18, sigFieldsY);

    const sigBoxY = sigFieldsY + 6;
    const sigBoxH = 28;
    doc.setDrawColor(200,200,200);
    doc.rect(M, sigBoxY, pageW, sigBoxH);
    doc.setFontSize(9);
    doc.setTextColor(120,120,120);
    doc.text('Unterschrift (Platzhalter)', M+2, sigBoxY+6);
  }

  function resultTable(y, rows, maxY=contentMaxY){
    const cols = [
      {t:'Parameter', w:58},
      {t:'Messwert', w:24},
      {t:'Dauer', w:36},
      {t:'Grenzwert', w:24},
      {t:'Status', w:(pageW-142)}
    ];

    doc.setFontSize(9);
    doc.setFont(undefined,'bold');
    doc.setFillColor(240, 240, 240);
    doc.setDrawColor(200, 200, 200);

    const h = 7;
    doc.rect(M, y, pageW, h, 'FD');
    let x = M;
    doc.setTextColor(80, 80, 80);
    for(const c of cols){ doc.text(c.t, x+2, y+5.5); x += c.w; }

    doc.setFont(undefined,'normal');
    let yy = y + h;
    doc.setTextColor(50, 50, 50);
    let rowsDrawn = 0;
    for(const r of rows){
      const lineH = 6;
      if(yy + lineH > maxY) break;
      doc.setDrawColor(230, 230, 230);
      doc.rect(M, yy, pageW, lineH);
      let xx = M;
      for(let i=0;i<5;i++){
        const text = String(r[i] ?? '');
        if(i === 4 && text.includes('NICHT OK')) doc.setTextColor(255, 82, 82);
        else if(i === 4 && text.includes('OK')) doc.setTextColor(76, 175, 80);
        else doc.setTextColor(50, 50, 50);
        doc.text(text, xx+2, yy+5);
        xx += cols[i].w;
      }
      yy += lineH;
      rowsDrawn++;
    }
    return { y: yy, rowsDrawn };
  }

  const ev = getVal('eventName').trim() || '(unbenannt)';
  const dt = getVal('datumMessung').trim() || '';

  await drawHeader();
  let y = 28;
  const firstPageMaxY = signatureTopY - 2;

  y = section(y, 'Details');
  y += 2;
  y = await ensureSpaceWithin(y, 12, firstPageMaxY);
  y = fieldPair(y, 'Veranstaltung', ev, 'Datum', dt);
  y = await ensureSpaceWithin(y, 12, firstPageMaxY);
  y = fieldPair(y, 'Location', getVal('location'), 'Umgebung', getVal('umwelt'));

  const colGapLocal = 10;
  const colWLocal = (pageW - colGapLocal)/2;
  const orgLines = wrap(doc, getVal('organisator'), colWLocal - 4);
  const beschrLines = wrap(doc, getVal('beschreibung'), colWLocal - 4);
  const boxHLocal = Math.max(26, Math.max(orgLines.length, beschrLines.length)*4 + 8);
  y = await ensureSpaceWithin(y, 3 + boxHLocal + 8, firstPageMaxY);
  doc.setFontSize(10);
  doc.setFont(undefined,'bold');
  doc.text('Organisator:', M, y);
  doc.text('Beschreibung:', M + colWLocal + colGapLocal, y);
  const boxYLocal = y + 3;
  doc.setDrawColor(210,210,210);
  doc.rect(M, boxYLocal, colWLocal, boxHLocal);
  doc.rect(M + colWLocal + colGapLocal, boxYLocal, colWLocal, boxHLocal);
  doc.setFont(undefined,'normal');
  doc.text(orgLines, M+2, boxYLocal+6);
  doc.text(beschrLines, M + colWLocal + colGapLocal + 2, boxYLocal+6);
  y = boxYLocal + boxHLocal + 8;

  y = await ensureSpaceWithin(y, 22, firstPageMaxY);
  y = section(y, 'Messbeteiligte');
  y += 2;
  y = fieldPair(y, 'Messung durchgeführt von', getVal('messungVon'), 'FOH-Techniker', getVal('foh'));
  y = fieldPair(y, 'Messposition', getVal('messposition'), 'Lauteste Position', getVal('lautestePosition'));

  y = await ensureSpaceWithin(y, 38, firstPageMaxY);
  y = section(y, 'Messgerät & Kalibrierung');
  y += 2;
  y = fieldTriple(y, 'Messgerät', getVal('messgeraet'), 'Kalibrator', getVal('kalibratorModell'), 'Korrekturwert k1', header.k1);
  y = fieldTriple(y, 'Messgerät S/N', getVal('messgeraetSN'), 'Kalibrator S/N', getVal('kalibratorSN'), 'Korrekturwert k2', header.k2);
  y = fieldTriple(y, 'Firmware', getVal('firmware'), 'Log-Intervall', header.logIntervalText, 'k-Werte gesetzt', header.kset);

  const paSetupText = getPASetupInline() || '—';
  const paBoxH = Math.max(14, wrap(doc, paSetupText, pageW - 4).length * 4 + 8);
  y = await ensureSpaceWithin(y, 9 + 2 + paBoxH + 8, firstPageMaxY);
  y = section(y, 'Anlagen-Setup');
  y += 2;
  y = textBox(y, paSetupText) + 8;

  const rows = Array.from(document.querySelectorAll('#pegelTabelle tbody tr'))
    .map(tr => Array.from(tr.children).map(td => td.innerText));
  let remainingRows = rows.slice();
  const firstPageResultMinHeight = 9 + 2 + 7 + 6;
  let resultsStartedOnFirstPage = false;
  if(y + firstPageResultMinHeight <= signatureTopY){
    y = section(y, 'Messergebnisse');
    y += 2;
    const firstPageRows = resultTable(y, remainingRows, signatureTopY - 2);
    remainingRows = remainingRows.slice(firstPageRows.rowsDrawn);
    y = firstPageRows.y + 8;
    resultsStartedOnFirstPage = firstPageRows.rowsDrawn > 0;
  }

  drawSignatureBlock(signatureTopY);

  if(remainingRows.length){
    y = await startNewPage();
    let isContinuation = resultsStartedOnFirstPage;
    while(remainingRows.length){
      y = section(y, isContinuation ? 'Messergebnisse (Fortsetzung)' : 'Messergebnisse');
      y += 2;
      const pageRows = resultTable(y, remainingRows, contentMaxY);
      if(pageRows.rowsDrawn === 0){
        y = await startNewPage();
        isContinuation = true;
        continue;
      }
      remainingRows = remainingRows.slice(pageRows.rowsDrawn);
      y = pageRows.y + 8;
      if(remainingRows.length){
        y = await startNewPage();
        isContinuation = true;
      }
    }
  }

  const loudestDbA = (summary && summary.lafmax_dt != null)
    ? summary.lafmax_dt
    : (() => {
        const values = samples.map(s => s.LAFmax).filter(v => v != null && Number.isFinite(v));
        return values.length ? Math.max(...values) : null;
      })();
  const loudestDbC = (summary && summary.lcpeak_max != null)
    ? summary.lcpeak_max
    : (() => {
        const values = samples.map(s => s.LCpk).filter(v => v != null && Number.isFinite(v));
        return values.length ? Math.max(...values) : null;
      })();
  const formatLevelForChartTitle = (value, unit) => {
    const n = Number(value);
    return Number.isFinite(n) ? `${n.toFixed(1)} ${unit}` : '—';
  };

  applyChartTheme('light');
  doc.addPage();
  await drawHeader();
  y = 28;

  y = section(y, `Messverlauf – ${ev}`);
  y += 2;

  if(chartLAeq){
    doc.setFontSize(12);
    doc.setFont(undefined,'bold');
    doc.setTextColor(40, 40, 40);
    doc.text('LAeq_g30 mit Grenzwert 99 dB(A)', M, y);
    doc.setFontSize(10);
    doc.setFont(undefined,'normal');
    const loudestAText = `Lautester Wert dB(A): ${formatLevelForChartTitle(loudestDbA, 'dB(A)')}`;
    doc.text(loudestAText, M + pageW - doc.getTextWidth(loudestAText), y);
    const chartH = addChartImage(doc, chartLAeq, M, y+5, pageW, 95, 2);
    y += chartH + 12;
  }

  if(chartLCpeak){
    doc.setFontSize(12);
    doc.setFont(undefined,'bold');
    doc.setTextColor(40, 40, 40);
    doc.text('LCpeak mit Grenzwert 135 dB(C)', M, y);
    doc.setFontSize(10);
    doc.setFont(undefined,'normal');
    const loudestCText = `Lautester Wert dB(C): ${formatLevelForChartTitle(loudestDbC, 'dB(C)')}`;
    doc.text(loudestCText, M + pageW - doc.getTextWidth(loudestCText), y);
    addChartImage(doc, chartLCpeak, M, y+5, pageW, 95, 2);
  }

  applyChartTheme('dark');
  drawAllFooters();

  const fname = `${sanitizeBaseName()} nach DIN 15905-5`;

  try {
    const blob = doc.output('blob');
    await openPdfPreview(blob, `${fname}.pdf`);
  } catch (e) {
    doc.save(`${fname}.pdf`);
  }
}

async function generatePDF(){
  await generateTemplatePDF();
}

function exportHTML(){
  try{
    const state = buildStateObject();

    const __state_json = JSON.stringify(state)
      .replace(/</g, '\\u003c')
      .replace(/\u2028/g, '\\u2028')
      .replace(/\u2029/g, '\\u2029');
    const stateTag = `<script>window.__SAVED_STATE__ = ${__state_json};<\/script>`;
    const restoreScript = `
<script>
  (function(){
    const state = (window.__SAVED_STATE__ || null);
    if(!state) return;
    function restore(){
      if(typeof applySavedState === 'function'){
        try{ applySavedState(state, { persistRecovery:false }); return; }catch(e){ console.error(e); }
      }
      if(typeof setText === 'function') setText('parseInfo', 'Hinweis: Gespeicherter Stand erkannt, automatische Wiederherstellung aber nicht verfuegbar.');
    }
    if(document.readyState === 'complete') restore();
    else window.addEventListener('load', restore);
  })();
<\/script>`;

    const privacyNote = `\n<!-- DATENSCHUTZ: Diese Datei enthaelt alle eingegebenen Daten im Klartext und sollte vertraulich behandelt werden. -->`;

    const htmlRaw = document.documentElement.outerHTML;
    const bodyClose = '</body>';
    const insertAt = htmlRaw.toLowerCase().lastIndexOf(bodyClose);
    if(insertAt < 0) throw new Error('Konnte </body> im Dokument nicht finden.');
    const html = htmlRaw.slice(0, insertAt)
      + stateTag + '\n' + restoreScript + privacyNote + '\n'
      + htmlRaw.slice(insertAt);

    const blob = new Blob([html], {type:'text/html'});
    const fname = `${sanitizeBaseName()}.html`;
    triggerDownload(blob, fname, true);
    setText('parseInfo', 'Stand als HTML gespeichert.');
  }catch(err){ alert('Fehler beim Exportieren: '+String(err)); console.error(err); }
}

el('btnExportHtml').addEventListener('click', ()=>{

});

  generateLegacyPDF();

el('btnImport').addEventListener('click', ()=>{
  const inp = el('fileInput'); if(inp) inp.click();
});

el('fileInput').addEventListener('change', (e)=>{
  const f = e.target.files && e.target.files[0] ? e.target.files[0] : null;
  if(!f) return;

  if(f.size > MAX_LOG_BYTES){
    setDot('dotLog','bad');
    setText('chipLog', `Log: Datei zu groß (${f.name})`);
    setText('parseInfo', `Datei ist zu groß: ${(f.size/1024/1024).toFixed(1)} MB. Maximum: ${(MAX_LOG_BYTES/1024/1024).toFixed(0)} MB.`);
    if(e.target) e.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const text = String(evt.target.result || '');

      setDot('dotLog','warn');
      setText('chipLog', `Log: parsing… (${f.name})`);

      parseHeaderAndMeta(text);
      const ts = parseBroadbandTimeSeries(text);
      const sm = parseBroadbandSummary(text);
      writeHeaderToUI();

      // Auto-fill "Datum der Messung" from header start date if user left it empty.
      if(!getVal('datumMessung').trim() && header.start){
        const m = String(header.start).match(/\d{4}-\d{2}-\d{2}/);
        if(m) setVal('datumMessung', m[0]);
      }

      if(sm.ok){ setDot('dotSummary','ok'); setText('chipSummary','Summary: gefunden'); }
      else { setDot('dotSummary','warn'); setText('chipSummary','Summary: nicht gefunden'); }

      // store original log text for export
      lastLogText = text;

      markRequiredFields();

      if(!ts.ok || !samples.length){
        logLoaded = false;
        lastLogFileName = '';
        setDot('dotLog','bad');
        setText('chipLog','Log: Fehler (keine Daten)');
        setPdfButtonsDisabled(true);
        updateComplianceStatus();
        return;
      }

      logLoaded = true;
      lastLogFileName = f.name;
      setDot('dotLog','ok');
      setText('chipLog', `Log: geladen (${f.name})`);
      calculateAndRender();
      scheduleRecoverySave();

    }catch(err){
      console.error(err);
      logLoaded = false;
      lastLogFileName = '';
      setDot('dotLog','bad');
      setText('chipLog','Log: Fehler');
      setText('parseInfo', 'Fehler beim Parsen: ' + String(err && err.message ? err.message : err));
      setPdfButtonsDisabled(true);
      updateComplianceStatus();
    }
  };
  reader.readAsText(f);
});

(function init(){
  const today = new Date().toISOString().split('T')[0];
  setVal('berichtDatum', today);
  applyLocationPreset(getVal('location') || 'Philharmonie Essen, Alfried-Krupp-Saal');
  setPdfButtonsDisabled(true);
  markRequiredFields();
  updateRecoveryButton();
  window.addEventListener('beforeunload', persistRecoveryState);
  window.addEventListener('pagehide', persistRecoveryState);
})();
</script>
